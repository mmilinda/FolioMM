services:
  - type: web
    name: folio-mm-backend
    runtime: docker
    dockerfilePath: Dockerfile
    dockerContext: .
    plan: free
    region: frankfurt
    envVars:
      - key: APP_NAME
        value: "FolioMM"
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        generateValue: true
      - key: RUN_MIGRATIONS
        value: "true"
      - key: RUN_SEED
        value: "true"
      - key: FIREBASE_PROJECT_ID
        value: "portfolio-e3d27"
